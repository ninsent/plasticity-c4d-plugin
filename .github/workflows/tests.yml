name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Embedded Python of the supported Cinema 4D releases:
        # 2023.0/2023.1 → 3.9, 2023.2 → 3.10, 2024–2026 → 3.11.
        python-version: ["3.9", "3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        # Coverage of the plugin package; plasticity_bridge/_vendor is
        # excluded in .coveragerc.
        run: python -m pytest --cov=plasticity_bridge --cov-report=term-missing

  build:
    name: Release zip (self-check)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: python scripts/build_release.py --quiet
